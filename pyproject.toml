[project]
name = "heartnn"
version = "0.1.0"
description = "Logistic regression and neural networks from scratch in NumPy, with MLflow-tracked convergence experiments on UCI Heart Disease."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "mlflow>=3.17",
    "pyyaml>=6.0",
    "ucimlrepo>=0.0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pre-commit>=3.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
